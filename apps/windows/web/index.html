<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MxU Slides</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div class="shell" id="shell">

  <!-- The toolbar floats over the top 52pt of the window, as on the Mac (AppShell overlays). -->
  <div class="toolbar" id="toolbar">
    <div class="toolbar-leading" id="toolbar-leading">
      <button class="icon-button sidebar-toggle" id="sidebar-toggle" title="Toggle the sidebar"></button>
      <span class="toolbar-service-name" id="toolbar-service-name" hidden></span>
      <div class="present-chips" id="present-chips">
        <button class="icon-button" id="view-options" title="Present view preferences — thumbnails only, never output"></button>
        <div class="transition-chips">
          <button class="icon-button transition" id="transition-media" title="Dissolve 0.7s — the media layer's default transition"></button>
          <button class="icon-button transition" id="transition-slide" title="Cut — the slide layer's default transition"></button>
        </div>
      </div>
    </div>
    <div class="toolbar-center">
      <button class="mode-switcher" id="mode-switcher" title="Switch between Present and Edit">
        <span id="mode-title">Present</span><span class="updown"></span>
      </button>
      <div class="segmented" id="edit-contexts" hidden>
        <button class="segment selected">Slides</button><button class="segment">Overlays</button><button class="segment">Themes</button><button class="segment">Confidence</button>
      </div>
    </div>
    <div class="toolbar-trailing" id="toolbar-trailing">
      <button class="capsule" id="broadcast-chip" title="Stream &amp; Record — stream and recording status"></button>
      <button class="capsule" id="preset-chip" title="Output Preset: Default — All Layers — which layers reach the glass"></button>
      <button class="capsule" id="clear-chip" title="Clear — everything at once, one function, or one layer"></button>
    </div>
  </div>

  <aside class="sidebar" id="sidebar">
    <section class="panel service-panel" id="service-panel">
      <div class="panel-caption-row"><span class="caption">Service Flow</span></div>
      <div class="service-header">
        <button class="quiet-chip" id="service-menu" title="Choose the service"><span id="service-name">Choose…</span><span class="chev"></span></button>
        <span class="spacer"></span>
        <button class="service-date" id="service-date" title="The service date"></button>
      </div>
      <div class="divider"></div>
      <div class="run-order" id="run-order"></div>
      <div class="divider"></div>
      <div class="add-bar">
        <button class="text-button" id="add-item" disabled title="Editing the run order comes to Windows later"><span class="plus"></span>Add Item</button>
        <span class="spacer"></span>
        <span class="footnote" id="item-count"></span>
      </div>
    </section>
    <div class="split-grip" id="sidebar-grip" title="Resize"></div>
    <section class="panel library-panel" id="library-panel">
      <div class="library-header">
        <span class="caption">Libraries</span>
        <label class="search" id="search-field"><span class="search-glyph"></span><input id="library-search" type="search" placeholder="Search" autocomplete="off" spellcheck="false"></label>
        <button class="icon-button tiny" id="library-filter" title="Filter the library"></button>
      </div>
      <div class="tab-row" id="library-tabs"></div>
      <div class="divider"></div>
      <div class="library-list" id="library-list"></div>
      <div class="divider"></div>
      <div class="library-footer">
        <button class="text-button" id="library-new" disabled title="Editing comes to Windows later"><span class="plus"></span>New</button>
        <button class="text-button" id="library-new-folder" disabled title="Editing comes to Windows later"><span class="folder-plus"></span>New Folder</button>
        <span class="spacer"></span>
        <button class="icon-button tiny" id="library-view-mode" title="List view — click for grid"></button>
      </div>
    </section>
  </aside>

  <main class="main" id="main">
    <div class="present-view" id="present-view" tabindex="0"></div>
    <div class="present-footer">
      <div class="transport-strip idle" id="transport-strip">
        <button class="layer-chip" title="Which media layer the transport controls"><span class="layers-glyph"></span>Foreground Videos<span class="chev"></span></button>
        <button class="transport-button" title="Play"><span class="play-glyph"></span></button>
        <div class="transport-middle">
          <div class="transport-title">No video playing</div>
          <div class="scrub-bar"></div>
          <div class="transport-time">0:00 / 0:00</div>
        </div>
        <button class="transport-button stacked" title="Skip to the last 30 seconds"><span class="skip-glyph"></span><small>-30</small></button>
      </div>
    </div>
  </main>

  <aside class="rail" id="rail">
    <section class="panel preview-panel" id="preview-panel">
      <div class="section-header"><span class="caption">Output Preview</span><span class="spacer"></span><button class="quiet-chip small" id="preview-target" title="Which screen the preview shows"><span id="preview-target-name">Audience</span><span class="chev"></span></button></div>
      <div class="preview-frame"><canvas id="preview-canvas" width="1920" height="1080"></canvas></div>
    </section>
    <div class="split-grip" id="rail-grip" title="Resize"></div>
    <section class="panel controls-panel">
      <div class="section-header"><span class="caption">Service Controls</span><span class="spacer"></span><button class="icon-button tiny" id="module-popout" title="Open this module in its own window (not on Windows yet)" disabled></button></div>
      <div class="tab-row modules" id="module-tabs"></div>
      <div class="divider"></div>
      <div class="module-body" id="module-body"></div>
    </section>
  </aside>
</div>

<div class="popover" id="popover" hidden></div>
<div class="toast" id="toast" hidden></div>

<script src="/static/renderer.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
